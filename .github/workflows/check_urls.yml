name: Check URLs

on:
  push:
    branches:  [ "main", rel-* ]
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/check_urls.yml"
  schedule:
    # Run every month
    - cron:  '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false



    - name: Check links
      uses: lycheeverse/lychee-action@v2
      with:
        args: --root-dir . --cache-exclude-status=400..599 --cache .
